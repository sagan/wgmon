[target.mipsel-unknown-linux-musl]
image = "ghcr.io/cross-rs/mipsel-unknown-linux-musl:main"
build-std = true
pre-build = [
    """
    export DEBIAN_FRONTEND=noninteractive
    export CC=mipsel-linux-muslsf-gcc
    export SYSROOT=/usr/local/mipsel-linux-muslsf
    apt-get update && apt-get -y --no-install-recommends install autoconf autopoint automake libtool flex bison gawk clang make pkg-config curl &&
    mkdir -p $SYSROOT/include $SYSROOT/lib &&
    ar rcs $SYSROOT/lib/libunwind.a &&
    cd /tmp && curl -fsSL -o argp.tar.gz https://github.com/ericonr/argp-standalone/archive/743004c68e7358fb9cd4737450f2d9a34076aadf.tar.gz &&
    tar xzf argp.tar.gz &&
    cd argp-standalone-743004c68e7358fb9cd4737450f2d9a34076aadf &&
    autoreconf -i >/dev/null 2>&1 &&
    ./configure --host=mipsel-linux-muslsf --prefix=$SYSROOT >/dev/null 2>&1 &&
    make -j4 >/dev/null 2>&1 &&
    cp argp.h $SYSROOT/include/ &&
    cp libargp.a $SYSROOT/lib/ &&
    cd /tmp && curl -fsSL -o fts.tar.gz https://github.com/void-linux/musl-fts/archive/0bde52df588e8969879a2cae51c3a4774ec62472.tar.gz &&
    tar xzf fts.tar.gz &&
    cd musl-fts-0bde52df588e8969879a2cae51c3a4774ec62472 &&
    ./bootstrap.sh >/dev/null 2>&1 &&
    ./configure --host=mipsel-linux-muslsf --prefix=$SYSROOT >/dev/null 2>&1 &&
    make -j4 >/dev/null 2>&1 &&
    make install >/dev/null 2>&1 &&
    rm -rf /tmp/musl-fts-* /tmp/fts.tar.gz &&
    cd /tmp && curl -fsSL -o obstack.tar.gz https://github.com/void-linux/musl-obstack/archive/362629706cb24a68b5e02876f0250df95e2e3f8d.tar.gz &&
    tar xzf obstack.tar.gz &&
    cd musl-obstack-362629706cb24a68b5e02876f0250df95e2e3f8d &&
    ./bootstrap.sh >/dev/null 2>&1 &&
    ./configure --host=mipsel-linux-muslsf --prefix=$SYSROOT >/dev/null 2>&1 &&
    make -j4 >/dev/null 2>&1 &&
    make install >/dev/null 2>&1 &&
    rm -rf /tmp/musl-obstack-* /tmp/obstack.tar.gz /tmp/argp-standalone-* /tmp/argp.tar.gz &&
    test -f $SYSROOT/include/argp.h && test -f $SYSROOT/include/fts.h && test -f $SYSROOT/include/obstack.h && echo WGMON_MUSL_COMPAT_OK
    """,
]

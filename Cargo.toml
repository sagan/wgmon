[package]
name = "wgmon"
version = "0.1.0"
edition = "2021"
description = "Passive WireGuard ingress link-quality monitor (eBPF)"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
libbpf-rs = { version = "0.27", features = ["vendored"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
libbpf-cargo = "0.27"

[profile.release]
lto = true
strip = true
